<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenAI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">🤖</div>
        <h1>GenAI Bot</h1>
      </div>
      <button class="new-chat" id="newChatBtn">New Chat</button>
    </aside>

    <main class="main-panel">
      <section class="chat-panel">
        <div class="chat-header">
          <h2>Chat with AI</h2>
          <p>Ask anything and get a helpful response.</p>
        </div>

        <div class="chat-feed" id="chatFeed"></div>

        <div class="input-area">
          <input type="text" id="userInputBottom" placeholder="Type your message here...">
          <button id="sendBtnBottom">Send</button>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
